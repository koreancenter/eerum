<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#24242A" />
      <stop offset="55%" stop-color="#121214" />
      <stop offset="100%" stop-color="#0A0A0B" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A30" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#101012" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C78A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.18" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Floating Luxury Card Silhouette -->
  <g transform="translate(96, 136)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect width="320" height="200" rx="20" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2" />
    
    <!-- Chip / Emblem -->
    <rect x="36" y="36" width="48" height="34" rx="7" fill="url(#goldAccent)" opacity="0.9" />
    <line x1="36" y1="53" x2="84" y2="53" stroke="#5A4405" stroke-width="1.5" />
    <line x1="60" y1="36" x2="60" y2="70" stroke="#5A4405" stroke-width="1.5" />
    
    <!-- Minimalist Typography Lines -->
    <text x="36" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF" letter-spacing="2">eerum</text>
    <text x="124" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="300" fill="#A1A1AA" letter-spacing="4">이룸</text>
    
    <rect x="36" y="146" width="130" height="3" rx="1.5" fill="#52525B" />
    <rect x="36" y="156" width="80" height="3" rx="1.5" fill="#3F3F46" />

    <!-- Card Brand Tag / Holographic Dot -->
    <circle cx="276" cy="154" r="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <circle cx="276" cy="154" r="5" fill="url(#goldAccent)" />
  </g>
</svg>
