<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Gracefully silence harmless WebSocket / HMR disconnect events in Cloud Run preview
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1)) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && typeof e.reason.message === 'string' && (e.reason.message.indexOf('WebSocket') !== -1 || e.reason.message.indexOf('vite') !== -1)) {
          e.stopImmediatePropagation();
        }
      });
    </script>
    <meta name="theme-color" content="#0A0A0B" />
