    <script data-dev-hmr-shim>
      (function () {
        // Intercept Vite HMR WebSocket so it never fails or throws in environments with disabled HMR
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          var DummyWebSocket = function (url, protocols) {
            var isHmr = false;
            if (
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)
            ) {
              isHmr = true;
            } else if (
              typeof url === 'string' &&
              (url.indexOf('vite') !== -1 || url.indexOf('hmr') !== -1)
            ) {
              isHmr = true;
            }

            if (isHmr) {
              var target = new EventTarget();
              target.binaryType = 'blob';
              target.readyState = 1; // WebSocket.OPEN
              target.url = url;
              target.protocol = 'vite-hmr';
              target.extensions = '';
              target.bufferedAmount = 0;
              target.send = function () {};
              target.close = function () {};
              target.onopen = null;
              target.onclose = null;
              target.onerror = null;
              target.onmessage = null;
              target.CONNECTING = 0;
              target.OPEN = 1;
              target.CLOSING = 2;
              target.CLOSED = 3;

              setTimeout(function () {
                var openEvt = new Event('open');
                if (typeof target.onopen === 'function') target.onopen(openEvt);
                target.dispatchEvent(openEvt);
              }, 10);

              return target;
            }

            return new OrigWebSocket(url, protocols);
          };

          DummyWebSocket.CONNECTING = 0;
          DummyWebSocket.OPEN = 1;
          DummyWebSocket.CLOSING = 2;
          DummyWebSocket.CLOSED = 3;
          DummyWebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket = DummyWebSocket;
        }

        // Gracefully silence harmless WebSocket / HMR disconnect events in Cloud Run preview
        function isViteWsError(str) {
          if (!str || typeof str !== 'string') return false;
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('vite') !== -1
          );
        }

        window.onerror = function (msg, source, lineno, colno, error) {
          var text =
            (msg || '') +
            ' ' +
            (source || '') +
            ' ' +
            (error && error.message ? error.message : '');
          if (isViteWsError(text)) {
            return true;
          }
        };

        window.addEventListener(
          'error',
          function (e) {
            var msg = (e && (e.message || (e.error && e.error.message))) || '';
            if (isViteWsError(msg)) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e && e.reason;
            var msg =
              typeof reason === 'string'
                ? reason
                : (reason && (reason.message || String(reason))) || '';
            if (isViteWsError(msg)) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          },
          true
        );

        var origError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str =
              typeof arg === 'string'
                ? arg
                : (arg && (arg.message || String(arg))) || '';
            if (isViteWsError(str)) {
              return;
            }
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
