      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cinzel:wght@500;700&display=swap"

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Korean Center Global Network - Digital Business Card",
      "alternateName": "이룸 (eerum)",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "url": "https://eerum.goguma.app/",
      "description": "Interactive local-first digital business card studio with privacy-first on-device encryption and print-ready PDF generator.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <!-- Synchronous App Theme Bootstrap to prevent FOUC -->
    <script>
      (function () {
        var colors = {
          editorial_cream: '#FAF7F2',
          pop_vermilion: '#FFFDF5',
          cobalt_citrus: '#F6F9FF',
          bottega_sage: '#F3F5F1',
          obsidian_vault: '#0A0A0B'
        };
        var theme = 'editorial_cream';
        try {
          var saved = localStorage.getItem('eerum_app_theme');
          if (saved && Object.prototype.hasOwnProperty.call(colors, saved)) {
            theme = saved;
          }
        } catch (e) {}
        document.documentElement.dataset.appTheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', colors[theme]);
      })();
    </script>
    <!-- Critical render styling for instant first paint without FOUC -->
    <style>
      :root, [data-app-theme="editorial_cream"] {
        --app-bg: #FAF7F2; --app-surface: #FFFFFF; --app-surface-subtle: #F3EFE8;
        --app-text: #1C1B18; --app-text-muted: #6E6A63; --app-border: rgba(28,27,24,0.10);
        --app-accent: #D95D39; --app-accent-fg: #FFFFFF;
      }
      [data-app-theme="pop_vermilion"] {
        --app-bg: #FFFDF5; --app-surface: #FFFFFF; --app-surface-subtle: #FFF6DB;
        --app-text: #18181B; --app-text-muted: #52525B; --app-border: rgba(24,24,27,0.10);
        --app-accent: #E63946; --app-accent-fg: #FFFFFF;
      }
      [data-app-theme="cobalt_citrus"] {
        --app-bg: #F6F9FF; --app-surface: #FFFFFF; --app-surface-subtle: #EBF2FF;
        --app-text: #0F172A; --app-text-muted: #475569; --app-border: rgba(15,23,42,0.10);
        --app-accent: #1D4ED8; --app-accent-fg: #FFFFFF;
      }
      [data-app-theme="bottega_sage"] {
        --app-bg: #F3F5F1; --app-surface: #FCFDFB; --app-surface-subtle: #E7ECE4;
        --app-text: #1A332A; --app-text-muted: #4D665C; --app-border: rgba(26,51,42,0.11);
        --app-accent: #1E3A2F; --app-accent-fg: #FCFDFB;
      }
      [data-app-theme="obsidian_vault"] {
        --app-bg: #0A0A0B; --app-surface: #121214; --app-surface-subtle: rgba(255,255,255,0.05);
        --app-text: #F5F5F7; --app-text-muted: #A1A1AA; --app-border: rgba(255,255,255,0.10);
        --app-accent: #FFFFFF; --app-accent-fg: #0A0A0B;
      }
      html, body {
        background-color: var(--app-bg);
        color: var(--app-text);
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body class="bg-[var(--app-bg)] text-[var(--app-text)] antialiased selection:bg-[var(--app-accent)] selection:text-[var(--app-accent-fg)]">
    <div id="root">
      <!-- Instant Pre-rendered Shell matching App + WelcomeCard for sub-second FCP/LCP and minimal Speed Index -->
      <div id="app-prerender-skeleton" style="min-height:100vh;min-height:100dvh;width:100%;background-color:var(--app-bg);color:var(--app-text);display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="height:49px;border-bottom:1px solid var(--app-border);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;box-sizing:border-box;">
          <span style="padding:6px 14px;border-radius:12px;background:var(--app-accent);color:var(--app-accent-fg);font-size:12px;font-weight:600;">내 명함</span>
          <span style="padding:6px 14px;border-radius:12px;color:var(--app-text-muted);font-size:12px;font-weight:600;">명함 보관함 0</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0.5rem 1rem;text-align:center;box-sizing:border-box;">
          <div style="width:48px;height:28px;margin-bottom:1rem;border-radius:6px;border:1px solid var(--app-border);background:var(--app-surface);display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;">
            <span style="width:12px;height:2px;background-color:var(--app-accent);"></span>
          </div>
          <p style="font-size:11px;letter-spacing:0.28em;color:var(--app-text-muted);text-transform:uppercase;margin:0 0 8px;font-weight:400;">Private Digital Identity Studio</p>
          <h1 style="font-size:40px;font-weight:500;letter-spacing:0.02em;color:var(--app-text);margin:0 0 12px;line-height:1.2;">
            eerum <span style="font-weight:300;color:var(--app-text-muted);font-size:24px;letter-spacing:0.15em;">이룸</span>
          </h1>
          <p style="font-size:13px;color:var(--app-text-muted);font-weight:400;max-width:440px;margin:0 auto 24px;line-height:1.6;">
            서버에 남지 않는 온디바이스 암호화로 당신만의 디지털 명함과 프라이빗 보관함을 완성하세요.
          </p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:320px;width:100%;">
            <div style="height:42px;padding:0 24px;border-radius:12px;background-color:var(--app-accent);color:var(--app-accent-fg);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex:1;min-width:130px;">
              내 명함 만들기
            </div>
            <div style="height:42px;padding:0 20px;border-radius:12px;border:1px solid var(--app-border);background-color:var(--app-surface);color:var(--app-text);font-size:13px;display:flex;align-items:center;justify-content:center;flex:1;min-width:130px;">
              샘플 둘러보기
            </div>
          </div>
          <div style="width:100%;max-width:672px;margin-top:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;">
            <div style="border-radius:12px;background:var(--app-surface);border:1px solid var(--app-border);padding:12px 8px;">
              <div style="font-size:12px;color:var(--app-text);font-weight:500;">3D Studio</div>
              <div style="font-size:11px;color:var(--app-text-muted);font-weight:400;margin-top:4px;">3D Canvas / Custom Card</div>
            </div>
            <div style="border-radius:12px;background:var(--app-surface);border:1px solid var(--app-border);padding:12px 8px;">
              <div style="font-size:12px;color:var(--app-text);font-weight:500;">Instant Share</div>
              <div style="font-size:11px;color:var(--app-text-muted);font-weight:400;margin-top:4px;">Offline QR / 300 DPI PDF</div>
            </div>
            <div style="border-radius:12px;background:var(--app-surface);border:1px solid var(--app-border);padding:12px 8px;">
              <div style="font-size:12px;color:var(--app-text);font-weight:500;">Zero-Server Vault</div>
              <div style="font-size:11px;color:var(--app-text-muted);font-weight:400;margin-top:4px;">AES-256 / On-Device</div>
            </div>
          </div>
        </div>
        <div style="height:49px;border-top:1px solid var(--app-border);display:flex;align-items:center;padding:0 32px;box-sizing:border-box;">
          <span style="font-size:11px;color:var(--app-text-muted);letter-spacing:0.1em;font-weight:400;">© 2026 GOGUMA CARD STUDIO</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
